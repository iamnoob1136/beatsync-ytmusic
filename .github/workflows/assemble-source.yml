name: Assemble full Beatsync source

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble, validate, and publish full source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/upstream /tmp/keep
          git clone --depth 1 https://github.com/freeman-jiang/beatsync.git /tmp/upstream

          mkdir -p /tmp/keep
          cp -a .beatsync-ytmusic /tmp/keep/.beatsync-ytmusic
          cp -a .github /tmp/keep/.github
          cp -a render.yaml /tmp/keep/render.yaml
          cp -a Dockerfile /tmp/keep/Dockerfile
          cp -a Dockerfile.client /tmp/keep/Dockerfile.client
          cp -a README.md /tmp/keep/README.md

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name .beatsync-ytmusic \
            ! -name render.yaml \
            ! -name Dockerfile \
            ! -name Dockerfile.client \
            ! -name README.md \
            -exec rm -rf {} +

          cp -a /tmp/upstream/. .
          rm -rf .beatsync-ytmusic .github
          cp -a /tmp/keep/.beatsync-ytmusic .
          cp -a /tmp/keep/.github .
          cp -a /tmp/keep/render.yaml .
          cp -a /tmp/keep/Dockerfile .
          cp -a /tmp/keep/Dockerfile.client .
          cp -a /tmp/keep/README.md .

          cp .beatsync-ytmusic/apps/server/src/managers/MusicProviderManager.ts apps/server/src/managers/MusicProviderManager.ts
          cp .beatsync-ytmusic/apps/server/src/websocket/handlers/handleStreamMusic.ts apps/server/src/websocket/handlers/handleStreamMusic.ts
          cp .beatsync-ytmusic/apps/server/src/routes/youtubeStream.ts apps/server/src/routes/youtubeStream.ts
          cp .beatsync-ytmusic/apps/server/src/index.ts apps/server/src/index.ts
          cp .beatsync-ytmusic/apps/server/package.json apps/server/package.json
          cp .beatsync-ytmusic/apps/client/src/lib/urls.ts apps/client/src/lib/urls.ts

          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun install
          bun run --cwd apps/server typecheck
          bun run --cwd apps/client typecheck

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c core.hooksPath=/dev/null commit -m "Build complete Beatsync with YouTube Music support" || true
          git push
