services:
  - type: web
    name: beatsync-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

  - type: web
    name: beatsync-client
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.client
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://beatsync-server.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        value: wss://beatsync-server.onrender.com/ws
